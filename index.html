<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:wght@600;700&display=swap">
<style>
:root{--bg:#f1f5f7;--surface:#ffffff;--text:#1d2931;--border:#dee3e7;--accent:#2877af;--accent2:#3949d2;--muted:#6a7881;--on-accent:#ffffff;
--r:22px;--gap:10px;--fs:13px;--body:'Inter',system-ui,sans-serif;--head:'Fraunces',Georgia,serif;--hw:700;
--s-interview:(33, 130, 60);--s-replied:(40, 118, 189);--s-applied:(143, 110, 25);--s-rejected:(189, 40, 40);--s-no-reply:(106, 120, 129)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.5 var(--body);min-height:100vh}
h1,h2,h3{font-family:var(--head);font-weight:var(--hw);letter-spacing:-.01em}
a{color:var(--accent)}
.shell{display:grid;min-height:100vh}
nav{display:flex;gap:6px;padding:var(--gap)}
nav .brand{font-family:var(--head);font-weight:var(--hw);font-size:1.25em;margin-bottom:4px}
nav a{padding:8px 14px;border-radius:var(--r);text-decoration:none;color:var(--muted);font-weight:500}
nav a.on{background:var(--accent);color:var(--on-accent)}
nav a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:calc(var(--gap)*1.5);max-width:1200px;width:100%}
.page{display:none}.page.on{display:block}
.badge{display:inline-block;font-size:.8em;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid currentColor}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:calc(var(--gap)*1.1)}
.sample{font-size:.8em;color:var(--muted);margin-bottom:var(--gap)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.stat b{display:block;font:var(--hw) 2.1em/1.1 var(--head)}
.stat span{color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.row{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;margin:8px 0}
.bar{height:12px;background:var(--border);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.weeks{display:flex;align-items:flex-end;gap:8px;height:120px}
.weeks div{flex:1;background:var(--accent2);border-radius:var(--r) var(--r) 0 0;position:relative}
.weeks small{position:absolute;bottom:-20px;left:0;right:0;text-align:center;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--gap)}
.doc h3{font-size:1.1em}.doc .meta{color:var(--muted);margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:3px 10px;font-size:.85em}
summary{cursor:pointer;color:var(--accent);font-weight:500}
details p{margin-top:8px;color:var(--muted)}
h2{margin:0 0 var(--gap)}
@media(max-width:720px){.shell{display:block!important}main{padding:16px}nav{flex-direction:row!important;flex-wrap:wrap;position:static!important;height:auto!important;border-right:0!important;justify-content:flex-start!important}nav .brand{font-size:1.1em!important;margin:0 8px 0 0!important}nav .brand::before{content:none!important}}
.shell{grid-template-rows:auto 1fr}nav{justify-content:center;align-items:center}nav .brand{margin:0 24px 0 0}main{margin:0 auto}.card{box-shadow:0 6px 20px -12px rgba(0,0,0,.35)}.stat{text-align:center}</style></head><body class="cards"><div class="shell">
<nav aria-label="Main"><span class="brand">Job Tracker</span><a href="#dashboard">Dashboard</a><a href="#applications">Applications</a></nav>
<main>
<section class="page on" id="dash"><h2>Dashboard</h2><p class="sample">Live data</p>
<div class="stats" id="stats"></div>
<div class="panels"><div class="card"><h3>Status</h3><div id="funnel"></div></div><div class="card"><h3>Applications per week</h3><div class="weeks" id="weeks" style="margin-bottom:24px"></div></div></div>
<div class="card tablecard"><h3 style="margin-bottom:8px">All applications</h3><div class="tablewrap"><table><thead><tr><th>Company</th><th>Role</th><th>Where</th><th>Status</th><th>Applied</th><th>Closes</th><th>Fit</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</section>
<section class="page" id="applications"><h2>Applications</h2><p class="sample">Live data</p><div class="docs" id="docs"></div></section>
</main></div><script>
const D=[["VIVI SRL", "Junior Data & Operations Specialist (Stage)", "Tolentino MC", "applied", "2026-11-16", "2026-12-31", 100], ["Accenture Spa", "Business Analyst - Intern", "Torino, Milano, Roma", "applied", "2026-11-16", "2026-11-17", 83], ["Accenture Spa", "Junior SAP Finance Analyst - Internship", "Milano, Padova, Roma", "applied", "2026-11-16", "2026-11-17", 78], ["Synergie Italia (Filiale di Ancona)", "Addetto/a Controllo di Gestione Junior", "Jesi", "applied", "2026-11-16", "2026-11-23", 85]];
const S=(s)=>`<span class="badge" style="color:var(--s-${s})">${s}</span>`;
const n=(s)=>D.filter(x=>x[3]===s).length;
const applied=D.length||1,resp=D.filter(x=>['interview','replied','rejected'].includes(x[3])).length;
document.getElementById('stats').innerHTML=[['Applied',applied],['Responses',resp],['Interviews',n('interview')],['Response rate',Math.round(resp/applied*100)+'%']].map(([k,v])=>`<div class="card stat"><b>${v}</b><span>${k}</span></div>`).join('');
const st=['applied','replied','interview','rejected','no-reply'];
document.getElementById('funnel').innerHTML=st.map(s=>`<div class="row"><span>${s}</span><div class="bar"><i style="width:${n(s)/applied*100}%;background:var(--s-${s})"></i></div><b>${n(s)}</b></div>`).join('');
const wk={};D.forEach(x=>{const d=new Date(x[4]);const k=Math.floor((d.getDate()-1)/7);wk[k]=(wk[k]||0)+1});
document.getElementById('weeks').innerHTML=Object.keys(wk).sort().map(k=>`<div style="height:${wk[k]/Math.max(...Object.values(wk))*100}%"><small>W${+k+1}</small></div>`).join('');
document.getElementById('rows').innerHTML=D.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${S(x[3])}</td><td>${x[4]}</td><td>${x[5]}</td><td>${x[6]}%</td></tr>`).join('');
document.getElementById('docs').innerHTML=D.map(x=>`<article class="card doc"><h3>${x[1]}</h3><div class="meta">${x[0]} &middot; ${x[2]}<br>Applied ${x[4]} &middot; Closes ${x[5]}</div><div class="chips"><span class="chip">CV</span><span class="chip">Cover letter</span><span class="chip">Motivation letter</span>${S(x[3])}</div><details><summary>Preview cover letter</summary><p>Sample text only. The real page shows the tailored, humanized cover letter for this role, built from facts in the CV.</p></details></article>`).join('');
function route(){const h=location.hash==='#applications'?'applications':'dash';document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===h));document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+(h==='dash'?'dashboard':h)))}
addEventListener('hashchange',route);route();
</script></body></html>
